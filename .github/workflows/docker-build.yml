name: CI - Build Docker Image

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Build image (tag: autoflow:ci)
        uses: docker/build-push-action@v4
        id: build
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: autoflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image - python import check
        run: |
          echo "Running smoke test for autoflow:ci"
          # Quick import-check
          docker run --rm autoflow:ci /bin/bash -lc "/opt/venv/bin/python -c \"import importlib, sys; sys.path.insert(0, '/opt/autoflow_Bot'); m=importlib.import_module('strategies.ml_grid_strategy'); print('import_ok', getattr(m, 'MLGridStrategy', None) is not None)\""
          # Install pytest in the container venv and run a targeted unit test to validate runtime
          docker run --rm autoflow:ci /bin/bash -lc "/opt/venv/bin/pip install pytest && /opt/venv/bin/pytest -q tests/test_indicators.py"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/autoflow:${{ github.ref_name }}
      - name: Log in to Docker Hub
        if: secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/autoflow:${{ github.ref_name }}
