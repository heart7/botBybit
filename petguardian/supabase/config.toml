# Supabase local development config (Supabase CLI).
# `supabase start` boots Postgres + Auth + Storage; `supabase db reset` applies the
# migrations in supabase/migrations and then supabase/seed.sql.
project_id = "petguardian"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["petguardian://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Local dev convenience. ENABLE confirmations in staging/production.
enable_confirmations = false

[auth.rate_limit]
# Guardrail (Doc 09 §6): rate-limit auth/email endpoints to curb abuse.
# Requires a recent Supabase CLI; tune per environment.
email_sent = 30
sign_in_sign_ups = 30
token_refresh = 150

[storage]
enabled = true
# Global upload ceiling; the pet-media bucket sets its own 50 MiB cap + allowed
# MIME types in migration 0011. Buckets are private; media is served via short-lived
# signed URLs only (Doc 09 §5).
file_size_limit = "50MiB"
